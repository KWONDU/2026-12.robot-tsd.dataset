name_ko: 공장
robot_ko: 공장 운반 로봇
place_ko: 공장
fixture_ko: 설비
golden: golden/manufacturing/deliver_detour.json
golden_examples:
- golden/manufacturing/deliver_detour.json
- golden/manufacturing/deliver_wait_detour.json # 집으러 가는 길의 막힘·출입 제한 우회와 멈춘 받는 곳 기다리기
goal_state_keys: []
goal_relations:
  'on': 위
  in: 안
  near: 근처
  held_by: 로봇이 들고 있음
  robot_at: 로봇이 그 곳에 와 있음 (주어가 곳, 대상은 null)
knowledge: '이 도메인의 로봇은 공장 지도를 미리 갖고 있다. 지도에는 구역, 곳(설비), 곳 사이의 통로와 길이, 막힌 통로, 출입 제한 구역과 그 구역을 지나는 통로(''…을 지남''), 한 방향 통로, 시설 알림이 있다. 로봇이 지금 보는 것은 지금 있는 곳의 물건뿐이고, 다른 곳의 물건은 공장 시스템이 알려 준 것이다. 물건을 옮기는 작업은 물건이 처음 있는 곳에서 시작해 받는 곳에서 끝나고, 물건 없이 어느 곳으로 가는 작업은 지금 있는 곳에서 시작한다. 막힌 통로와 출입 제한 구역을 지나는 통로는 쓸 수 없고, 한 방향 통로는 적힌 방향으로만 다닌다. 로봇이 지금 있는 곳에서 물건이 있는 곳까지, 물건이 있는 곳에서 받는 곳까지(들르는 곳이 있으면 그 사이마다) 통로 길이로 가장 짧은 길을 따져, 그 길에 쓸 수 없는 통로가 있으면 그 통로 이름과 까닭(막힘, 출입 제한 구역을 지남, 한 방향이라 거꾸로 갈 수 없음)을 어느 구간에서인지와 함께 공간 제약(spatial)으로 쓴다. 대신 지나갈 길은 쓰지 않는다: 길을 고르는 것은 이동 계획이 할 일이고 설명문은 계획을 담지 않는다. 한 방향 통로는 거꾸로 가야 할 때만 쓴다. 들르는 순서가 정해지지 않은 작업(두 곳에 나눠 갖다 놓기)은 길을 하나로 정하지 않는다. 점검으로 멈춘 설비에 물건을 넣으려면 다시 가동될 때까지 기다려야 하고(시설 알림에 남은 시간이 있다), 가공에는 정해진 시간이 걸린다. 이 시간은 시간 조건(time)에, 그 때문에 생기는 순서는 선후 제약(precedence)에 쓴다. 로봇이 어느 곳에 와 있어야 끝나는 작업(충전소로 가기)은 목표 상태에 robot_at으로 쓰고(주어가 그 곳, 대상은 null), 그 곳은 목표 상태의 주어이므로 필수다. 물체의 무게는 환경 설명에 없으므로 근거로 삼지 않는다.'
# 채점 프롬프트(check_v20부터)의 지식 문단: 가장 짧은 길 계산은 규칙 검사 situation이 맡으므로 채점 모델에게는 그 지시를 뺀다
knowledge_check: '이 도메인의 로봇은 공장 지도를 미리 갖고 있다. 지도에는 구역, 곳(설비), 곳 사이의 통로와 길이, 막힌 통로, 출입 제한 구역과 그 구역을 지나는 통로(''…을 지남''), 한 방향 통로, 시설 알림이 있다. 로봇이 지금 보는 것은 지금 있는 곳의 물건뿐이고, 다른 곳의 물건은 공장 시스템이 알려 준 것이다. 물건을 옮기는 작업은 물건이 처음 있는 곳에서 시작해 받는 곳에서 끝나고, 물건 없이 어느 곳으로 가는 작업은 지금 있는 곳에서 시작한다. 설명문의 공간 제약에는 작업에 걸리는 쓸 수 없는 통로와 그 까닭이 적힌다. 그 통로가 정말 가장 짧은 길에 걸리는지, 빠진 통로가 없는지는 규칙 검사가 지도로 이미 확인했으므로 채점할 때 길을 따지지 않는다. 대신 지나갈 길은 적지 않는 것이 맞다. 점검으로 멈춘 설비에 물건을 넣으려면 다시 가동될 때까지 기다려야 하고(시설 알림에 남은 시간이 있다), 가공에는 정해진 시간이 걸린다. 이 시간은 시간 조건(time)에, 그 때문에 생기는 순서는 선후 제약(precedence)에 쓴다. 로봇이 어느 곳에 와 있어야 끝나는 작업(충전소로 가기)은 목표 상태에 robot_at으로 쓰고(주어가 그 곳, 대상은 null), 그 곳은 목표 상태의 주어이므로 필수다. 물체의 무게는 환경 설명에 없으므로 근거로 삼지 않는다.'
# 도메인마다 다른 프롬프트 규칙 문장. 키가 곧 프롬프트의 자리 이름이고(<<DOMAIN_NAMING>> 등), 문장 안의 예시 자리
# (<<EX_...>>, <<DOMAIN_FIXTURE>>)는 이 프로필 값으로 채운다. 가정·물류 값은 예전 판 프롬프트에 박혀 있던 문장 그대로다.
# 대상이 흐려진 재작성 16/89건). 멈춘 설비는 물건을 넣으려고 기다리는 것이라 가정의 '닿으려면 먼저 상태를 바꿈'과 다르고,
# 그 기다림과 가공 시간은 지시가 말하지 않아도 시간 조건에 쓴다. 지도에서 따라 나오는 길 제약이 빠지면 채점이 깎는다
prompt_rules:
  DOMAIN_NAMING: '곳의 번호(예: <<EX_NUMBERED>>, 자동 창고 선반 3)는 공장에서 실제로 부르는 이름이라 사용자도 안다. 곳은 번호까지 환경 설명의 이름 그대로 부른다. 물체 이름 뒤의 번호(예: 타이밍 체인 2)는 사용자가 모르므로 쓰지 말고, 물체는 이름과 놓인 곳(예: <<EX_REFERRING>>)으로 가리킨다.'
  DOMAIN_NAME_NUMBERS: '물체의 번호는 빼고 곳의 번호는 그대로 둔다'
  DOMAIN_NAMING_JUDGE: '곳의 번호(예: <<EX_NUMBERED>>)는 공장에서 실제로 부르는 이름이라 재작성문에 그대로 쓴다. 물체 이름 뒤의 번호는 쓰지 않으므로, 물체는 번호 없이도 이름과 놓인 곳으로 하나로 특정되면 해소된 것으로 본다.'
  DOMAIN_AUX_STATE: '물건을 꺼내거나 넣으려면 먼저 상태가 바뀌어야 하는 <<DOMAIN_FIXTURE>>(예: <<EX_ACCESS>>. 물건을 받는 그 설비의 칸은 핵심 수단이고, 다시 가동될 때까지 기다려야 하는 설비 자체는 보조다. 지시가 그 상태를 바꾸라고 해서 goal_state에 쓴 경우는 필수다)'
  DOMAIN_AUX_STATE_CHECK: '물건을 꺼내거나 넣으려면 먼저 상태가 바뀌어야 하는 <<DOMAIN_FIXTURE>>(예: <<EX_ACCESS>>. 받는 칸은 핵심 수단이고 기다려야 하는 설비 자체는 보조)'
  DOMAIN_TIME: '지시가 말한 시간 조건(지속 시간, 기다리는 시간, 언제까지)과 환경 설명에서 따라 나오는 기다림·걸리는 시간(점검으로 멈춘 설비가 다시 가동될 때까지 남은 시간, 가공에 걸리는 시간)을 쓴다.'
  DOMAIN_TIME_CHECK: '지시가 말한 시간 조건(지속 시간, 기다리는 시간, 언제까지)과 환경 설명에서 따라 나오는 기다림·걸리는 시간(점검으로 멈춘 설비가 다시 가동될 때까지 남은 시간, 가공에 걸리는 시간)'
  DOMAIN_ROUTE_CHECK: ' 길 점검 순서(꼭 지킨다): 공간 제약을 쓰기 전에 다음 구간마다 길을 점검하고 reasoning의 ④에 구간마다 적는다. (1) 로봇이 지금 있는 곳에서 옮길 물건이 처음 있는 곳까지(로봇이 이미 그곳에 있으면 없다, 물건 없이 가는 작업이면 지금 있는 곳에서 가는 곳까지), (2) 물건이 있는 곳에서 받는 곳까지(들르는 곳이 있으면 그 사이마다). 구간마다 지도의 통로 줄에서 통로 길이를 더해, 막힘·출입 제한·한 방향을 따지지 않은 가장 짧은 길을 찾는다. 그 길에 막힌 통로, 출입 제한 구역을 지나는 통로(''…을 지남''), 거꾸로 가야 하는 한 방향 통로가 있으면 그 통로 이름과 까닭을 어느 구간인지와 함께 공간 제약으로 쓴다. 모든 구간에서 그런 통로가 없을 때만 공간 제약을 쓰지 않는다.' # gen_v20부터: 지식 문단 바로 뒤에 붙는 길 점검 순서 (공장만, 제조 Qwen이 길 점검을 빼먹어 넣음)
  DOMAIN_EXECUTABLE_CHECK: '. 이 도메인에서 길 제약(어느 통로가 가장 짧은 길에 걸리는지, 빠진 통로가 있는지)은 따로 규칙 검사가 지도로 확인하므로 이 항목에서 길을 계산해 판단하지 않고 그 때문에 감점하지 않는다. 이 항목에서는 제약에 적은 통로의 상태(막힘, 출입 제한 구역을 지남, 한 방향)가 지도의 통로 줄과 다르면 0점, 점검으로 멈춘 설비에 물건을 넣어야 하는데 기다림이 없으면 0점이다. 대신 지나갈 길을 적지 않은 것은 맞게 쓴 것이다'
prompt_examples:
  RECEPTACLES: 출하 도크·자동 창고
  LOCATIONS: '"가공기 2 출구 버퍼 위", "자동 창고 선반 3 위"'
  STATES: '"가동 중", "미가동"'
  NUMBERED: 가공기 2
  ANY: 가공기
  REGION: 가공기 2 입구 버퍼, 자동 창고 선반 3
  REGION_LEVELS: '"자동 창고에 넣어"는 자동 창고, "자동 창고 선반에 올려"는 자동 창고 선반, "자동 창고 선반 3에 올려"는 자동 창고 선반 3, "조립 스테이션 1로 가져가"는 조립 스테이션 1 입구 버퍼'
  GROUP: 출구 버퍼에 있는 것을 모두 자동 창고로 옮겨
  HINT_GROUP: "'가공기 1부터 7까지(가공 구역)' 가운데 아무 데나 넣으면 될 때 '가공 구역'" # 위치 설명(구역)으로 여럿을 묶어 가리키기. 상태(돌고 있는)는 이름이 아니므로 묶는 말에 넣지 않는다
  ACCESS: 점검으로 멈춰 있어 다시 가동될 때까지 기다려야 하는 설비
  PRECONDITION: 막힌 통로를 피해 돌아가야 함
  STATE_COMMANDS: 켜라, 끄라
  REMOVE: 치우라, 수거하라
  UNSPECIFIED: a machining station
  ORIGIN: 캠축이 놓인 가공기 2
  SPACE: 가공기 2 출구 버퍼의 캠축을 조립 스테이션 1 입구 버퍼로 가져가는 작업이면 start는 "가공기 2", end는 "조립 스테이션 1". 충전소로 가는 작업이면 start는 로봇이 지금 있는 곳, end는 "충전소"
  GOAL_ACTION: 통로 7로 이동한다
  GOAL_STATE: 캠축이 조립 스테이션 1 입구 버퍼 위에 있다
  UNEXPRESSIBLE: 가공 정도, 주행 속도
  PLAN_STEPS: '"가공기 2로 이동", "캠축을 잡기"'
  REFERRING: 가공기 2 출구 버퍼에 있는 캠축, 돌고 있는 가공기
  OMISSION: 그거 조립 쪽으로 좀 갖다 줘
  RENAME: 원문이 machining station 2라고 해도 환경 설명에 '가공기 2'로 나오면 '가공기 2'라고 부른다
  EITHER: 캠축을 돌고 있는 아무 가공기에 넣으라는 지시라면 가공기 1에 넣는 경우와 가공기 3에 넣는 경우
