# 물류 도메인 (창고의 작업 구역). 도메인 하나에 이 파일 하나다. 원천 어댑터 설정의 domain(config/sources.yaml)이
# 이 이름을 고른다. 장면은 SimReady 창고 팩에서 오고(src/tsdgen/adapters/simready_warehouse.py), 작업 지시는 작업 합성이 만든다.
#
# 프롬프트는 도메인 낱말을 자리(<<DOMAIN_...>>, <<EX_...>>)로 받는다. 낱말 뒤에 조사가 바로 붙는 자리가 있으므로
# fixture_ko는 받침 없는 낱말로 고른다.

name_ko: 물류 창고 # 세계 상태 글의 '장소:'
robot_ko: 물류 작업 로봇 # 프롬프트의 역할 설명
place_ko: 창고 # 프롬프트의 '로봇이 인식한 ~의 세계 상태'
fixture_ko: 설비 # 옮기지 않는 설비를 부르는 낱말 (팔레트, 랙, 작업대, 카트)
golden: golden/logistics/uncover_box.json # 예전 판 프롬프트의 예시 자리 (이 도메인은 gen_v8 이후 판만 쓴다)
golden_examples: [golden/logistics/uncover_box.json]

# 목표 상태의 상태 단언에 쓸 수 있는 상태 키. 이 팩의 장면에는 여닫거나 켜는 설비가 없어 비어 있다.
goal_state_keys: []

# 목표 상태의 관계 단언에 쓸 수 있는 술어와 풀이 (프롬프트의 <<DOMAIN_RELATIONS>>)
goal_relations: { "on": 위, "in": 안, near: 근처, held_by: 로봇이 들고 있음 }

# 이 도메인에서만 필요한 지식. 생성·채점·재작성·해소 프롬프트의 <<DOMAIN_KNOWLEDGE>> 자리에 그대로 들어간다.
knowledge: >-
  이 도메인에서는 물체가 서로 위에 쌓여 있는 일이 많다. 옮길 물체 위나 안에 다른 물체가 놓여 있으면 그 물체를 먼저 치워야
  옮길 물체에 닿을 수 있다. 그런 물체는 대상 물체의 보조(auxiliary)에 올리고 note에 먼저 치워야 하는 물체라고 쓰며,
  그것을 치우는 일이 먼저라는 선후 제약(precedence)을 constraints에 쓴다. 지시가 그 물체를 어디에 두라고 말하지 않았으면
  그 물체의 도착 위치는 목표 상태에 쓰지 않는다. 같은 이름의 물체가 여럿이고 지시가 그 가운데 아무것이나 하나를 말하면
  번호를 뗀 이름으로 쓰고, 전부를 말하면 번호 붙은 이름을 하나씩 모두 쓴다. 이 도메인의 설비에는 여닫거나 켜는 상태가
  없으므로 상태 단언은 쓰지 않는다. 물체의 무게는 환경 설명에 없으므로 무게를 근거로 삼지 않는다.

# 도메인마다 다른 프롬프트 규칙 문장. 키가 곧 프롬프트의 자리 이름이고(<<DOMAIN_NAMING>> 등), 문장 안의 예시 자리
# (<<EX_...>>, <<DOMAIN_FIXTURE>>)는 이 프로필 값으로 채운다. 가정·물류 값은 예전 판 프롬프트에 박혀 있던 문장 그대로라
# rewrite_v7·resolve_v7·gen_v19·check_v19를 채운 글이 rewrite_v6·resolve_v6·gen_v18·check_v18과 글자까지 같다.
prompt_rules:
  DOMAIN_NAMING: '사용자는 환경 설명의 번호(예: <<EX_NUMBERED>>)를 모른다. 지시에 번호를 쓰지 말고, 사람이 말하듯 이름과 위치·특징(예: <<EX_REFERRING>>)으로 가리킨다.'
  DOMAIN_NAME_NUMBERS: '번호는 뺀다'
  DOMAIN_NAMING_JUDGE: '재작성문은 사용자가 한 말이라 환경 설명의 번호를 쓰지 않는다. 번호 없이도 이름과 위치·특징으로 하나로 특정되면 해소된 것으로 본다.'
  DOMAIN_AUX_STATE: '옮길 물체에 닿으려면 먼저 상태를 바꿔야 하는 <<DOMAIN_FIXTURE>>(예: <<EX_ACCESS>>. 지시가 그 상태를 바꾸라고 해서 goal_state에 쓴 경우는 필수다)'
  DOMAIN_AUX_STATE_CHECK: '먼저 상태를 바꿔야 닿을 수 있는 출발지 <<DOMAIN_FIXTURE>>(예: <<EX_ACCESS>>)'
  DOMAIN_TIME: '지시가 말한 시간 조건(지속 시간, 기다리는 시간, 언제까지)만 쓴다.'
  DOMAIN_TIME_CHECK: '지시가 말한 시간 조건(지속 시간, 기다리는 시간, 언제까지)'
  DOMAIN_ROUTE_CHECK: '' # gen_v20부터: 지식 문단 바로 뒤에 붙는 길 점검 순서 (공장만, 제조 Qwen이 길 점검을 빼먹어 넣음)
  DOMAIN_EXECUTABLE_CHECK: ''
prompt_examples:
  RECEPTACLES: 상자·크레이트
  LOCATIONS: '"작업대 선반 위", "팔레트 2 위"'
  STATES: '"문 닫힘", "가동 중"'
  NUMBERED: 팔레트 2
  ANY: 팔레트
  REGION: 랙 선반 2, 작업대 상판
  REGION_LEVELS: '"랙에 올려"는 랙, "랙 선반에 올려"는 랙 선반, "랙 맨 위 선반에 올려"는 랙 선반 1, "작업대 위에 올려"는 작업대 상판'
  GROUP: 작업대 위에 있는 노란 크레이트를 전부 팔레트로 옮겨
  HINT_GROUP: "'팔레트 5부터 8까지(랙 위)' 가운데 아무 데나 놓으면 될 때 '랙 위'"
  ACCESS: 덮개가 닫혀 있어 먼저 열어야 하는 보관 설비
  PRECONDITION: 위에 놓인 물체를 먼저 치워야 함
  STATE_COMMANDS: 켜라, 끄라, 열라, 닫으라
  REMOVE: 꺼내라, 치우라
  UNSPECIFIED: a pallet
  ORIGIN: 상자가 놓여 있는 작업대
  SPACE: '작업대 위 상자를 팔레트에 올리는 작업이면 start는 "작업대", end는 "팔레트". 카트의 상자와 랙의 크레이트를 작업대에 옮기는 작업이면 start는 "카트 혹은 랙", end는 "작업대"'
  GOAL_ACTION: 상자를 들어 올린다
  GOAL_STATE: 상자가 팔레트 위에 있다
  UNEXPRESSIBLE: 가지런히 정렬됨, 라벨이 앞을 향함
  PLAN_STEPS: '"팔레트로 이동", "상자를 잡기"'
  REFERRING: 팔레트 위에 쌓인 상자, 작업대 선반에 있는 크레이트
  OMISSION: 상자 좀 치워 줘
  RENAME: 원문이 work table이라고 해도 환경 설명에 '작업대'로 나오면 '작업대'라고 부른다
  EITHER: 노란 크레이트는 한 팔레트에, 파란 크레이트는 다른 팔레트에 올리라는 지시라면 노란 크레이트가 팔레트 1에 있는 경우와 팔레트 2에 있는 경우

