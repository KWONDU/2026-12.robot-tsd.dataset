# KIST 전달 README에서 세계 상태 보기(contextualize.world_state)마다 달라지는 문장. 키가 보기 등록 이름이다.
json:
  environment: '씬 정보. 가구(fixtures)와 물체(objects)의 id는 원본 데이터셋(RoboCasa365)이 쓰는 실제 이름 그대로입니다 (예: mug, cab_1_main_group_1). category는 원본의 영어 분류명이고, name_ko는 저희가 그 분류명을 한국어로 번역해 붙인 표시 이름입니다 (원본에는 없는 필드). 물체가 어느 가구 위 또는 안에 있는지는 placement에, 물체 사이의 위치 관계는 relations에 있습니다. 문 열림 같은 가구 상태는 확인된 경우 states에 값이 있고, 확인되지 않은 값은 비우거나 null로 둡니다. id를 원본 이름으로 바꾸고 관계 이름을 협의 어휘(in을 inside로)로 맞춘 것 외에는 생성 모델에 실제로 입력된 내용 그대로입니다.'
  pointer: '`subject`·`object`(environment_context의 id)'
text:
  environment: '씬 정보. 로봇이 인식한 주방의 세계 상태를 한국어 글로 적은 것으로, 생성 모델에 입력된 내용 그대로입니다. 장면에 있는 물체와 가구를 지시와 상관없이 모두 적습니다. 물체는 놓인 곳(가구 안의 칸까지, 예: "냉장고 냉동실 선반 위", 배치 기준이 된 옆 가구, 예: "조리대 3 위, 싱크대 옆", 또는 받치는 물체, 예: "접시 위")을, 가구는 문 열림·가동 같은 상태가 확인된 경우 그 상태를 함께 적습니다. 같은 이름이 여럿이면 "그릇 1", "그릇 2"처럼 번호로 구별하고, 가구 이름 뒤 괄호는 위치 설명입니다(예: 조리대 5(아일랜드 식탁)). 원본 데이터셋(RoboCasa365)의 id는 싣지 않습니다. 데이터에 없는 정보는 적지 않습니다.'
  pointer: '`subject`·`object`(environment_context에 나온 물체·가구 이름. target_objects의 ref도 같은 이름)'
