# Arena 상호운용 매핑. 값은 실제 Arena 저장소(data/raw/isaaclab_arena)에서 뽑았다.
#
# 이 파일은 우리 씬 상태와 Arena 환경 스펙 사이를 오갈 때만 쓰인다. 매핑이 없으면
# (null) 그 항목은 변환에서 빠지고 unmapped로 보고된다. 조용히 버리지 않는다.
#
# object_registry: 우리 물체 카테고리 -> Arena 객체 registry_name.
#   Arena 객체 라이브러리는 164종이고 우리 카테고리는 138종이라
#   상당수가 대응되지 않는다. 대응 없는 카테고리를 Arena로 내보내면 그 물체는 씬에서 사라진다.
#
# fixture_prim_path: 우리 fixture 카테고리 -> 배경 안의 prim 경로.
#   prim 경로는 주방 배경마다 다르므로 정답이 하나가 아니다. 아래 값은 실제 스펙에서
#   관찰된 예시이며, 다른 주방을 쓰면 Arena의 `cli_runner.py --mode prim_tree` 출력으로
#   확인해 채워야 한다 (Isaac Sim 필요).
#
# background_registry: RoboCasa layout/style 조합 -> Arena 주방 배경.
#   RoboCasa 주방은 2,500종인데 Arena 주방은 5종 남짓이라 1:1 대응이 없다.
#   default를 쓰되 그 사실을 provenance에 남긴다.

