# NVIDIA SimReady 창고 팩(PhysicalAI-SimReady-Warehouse-01)을 씬 상태로 옮기는 표.
# 팩의 장면 파일(USD)에서 놓인 에셋의 이름·위치·크기를 뽑는 일은 scripts/simready_extract.py가 하고,
# 어댑터(src/tsdgen/adapters/simready_warehouse.py)는 그 결과(data/simready_static/cells.json)와 이 표만 읽는다.
#
# 종류 낱말: 에셋 이름에서 접두사(sm_), 변형 번호(a07, 01), 색 낱말을 뺀 나머지다
# (SM_Crate_A07_Yellow_01 -> crate, 색 yellow). 여기 없는 종류는 장면에 넣지 않는다.

# 에셋 이름에서 종류 낱말을 얻는 규칙
name_prefix: "^(smv?_)" # 떼는 접두사
name_noise: "[a-z]?\\d+[a-z]*|pr|nvd|np|glossy|natural|woodnewa|woodrecycleda|roughblacka|bluea|blacka|steela" # 종류가 아닌 조각

# 색 낱말 -> 한국어 (이름 앞에 붙인다: 노란 크레이트)
colors:
  brown: 갈색
  white: 흰색
  yellow: 노란
  blue: 파란
  gray: 회색
  black: 검은
  red: 빨간
  green: 초록
  orange: 주황
  mint: 민트색
  lightgreen: 연두색
  violet: 보라색

# 옮기지 않는 설비. shelves가 참이면 물체가 놓인 높이마다 칸(선반)을 만든다. top이 참이면 맨 위 면은 칸이 아니라
# 상판이라는 칸으로 적는다(선반이 따로 없으면 칸을 만들지 않고 '작업대 위'로 적는다). containment는 물체가 놓일 때의 관계다.
fixtures:
  rack: { category: rack, ko: 랙, shelves: true }
  racklargeempty: { category: rack, ko: 랙, shelves: true }
  racklongempty: { category: rack, ko: 랙, shelves: true }
  bulkstoragerack: { category: rack, ko: 랙, shelves: true }
  trolley: { category: cart, ko: 카트, shelves: true }
  computercart: { category: cart, ko: 카트, shelves: true }
  cleaningtrolley: { category: cart, ko: 카트, shelves: true }
  heavydutypackingtable: { category: worktable, ko: 작업대, shelves: true, top: true }
  deluxepackingtable: { category: worktable, ko: 작업대, shelves: true, top: true }
  tablemetal: { category: worktable, ko: 작업대, shelves: true, top: true }
  metalstainlesstable: { category: worktable, ko: 작업대, shelves: true, top: true }
  blockpallet: { category: pallet, ko: 팔레트 }
  pallet: { category: pallet, ko: 팔레트 }
  wooddrumpallet: { category: pallet, ko: 팔레트 }
  solidtoprackablepallet: { category: pallet, ko: 팔레트 }
  exportpallet: { category: pallet, ko: 팔레트 }
  rackablepallet: { category: pallet, ko: 팔레트 }
  hygienepallet: { category: pallet, ko: 팔레트 }
  recycledwoodpallet: { category: pallet, ko: 팔레트 }
  galvanizedsteelpallet: { category: pallet, ko: 팔레트 }
  wingpallet: { category: pallet, ko: 팔레트 }
  recyclingcontainer: { category: recycling_bin, ko: 재활용함, containment: in }
  squarerecyclingcontainer: { category: recycling_bin, ko: 재활용함, containment: in }
  officerecyclingcontainer: { category: recycling_bin, ko: 재활용함, containment: in }
  trash: { category: trash_can, ko: 쓰레기통, containment: in }
  officetrashcan: { category: trash_can, ko: 쓰레기통, containment: in }
  domedwastetrashcan: { category: trash_can, ko: 쓰레기통, containment: in }
floor: { category: floor, ko: 바닥 } # 바닥에 바로 놓인 물체가 가리키는 곳
# 바닥이 아니라 다른 것 위에 올려진 설비(랙에 올린 팔레트, 팔레트 위의 팔레트)의 위치 설명. {support}에 받침의 이름이 들어간다
raised_fixture_desc: "{support} 위"

# 장면에 있는 물체. heavy가 참이면 손으로 옮길 대상이 아니다(장면에는 남고 작업의 대상으로는 고르지 않는다). traits는 작업 합성이 말이 되는 조합만 고르는 데 쓰는 성질이다(모델에게는 보여 주지 않는다):
# stackable 위에 다른 것을 쌓을 수 있는 상자류, holder 다른 것을 담는 용기, small 용기에 담을 만한 작은 것,
# disposable 버리거나 재활용할 포장재.
objects:
  crate: { category: crate, ko: 크레이트, traits: [stackable, holder] }
  flatbox: { category: flat_box, ko: 납작 상자, traits: [stackable] }
  multidepthbox: { category: box, ko: 상자, traits: [stackable] }
  printersbox: { category: printer_box, ko: 프린터 상자, traits: [stackable] }
  whitecorrugatedbox: { category: corrugated_box, ko: 골판지 상자, traits: [stackable] }
  cardbox: { category: cardboard_box, ko: 종이 상자, traits: [stackable] }
  cubebox: { category: cube_box, ko: 정육면체 상자, traits: [stackable] }
  longbox: { category: long_box, ko: 긴 상자, traits: [stackable] }
  cardboardboxopen: { category: open_box, ko: 열린 상자, traits: [holder, disposable] }
  cardboardboxesfolded: { category: folded_boxes, ko: 접힌 상자 묶음, traits: [stackable, disposable] }
  scotchtape: { category: tape, ko: 테이프, traits: [small] }
  paperroll: { category: paper_roll, ko: 종이 롤, traits: [small] }
  screwtoppail: { category: lidded_pail, ko: 뚜껑 달린 통, traits: [stackable] }
  plasticpail: { category: bucket, ko: 양동이, traits: [holder] }
  utilitybucket: { category: bucket, ko: 양동이, traits: [holder] }
  barcodescanner: { category: barcode_scanner, ko: 바코드 스캐너, traits: [small] }
  tapedispenser: { category: tape_dispenser, ko: 테이프 커터기, traits: [small] }
  container: { category: storage_bin, ko: 보관함, traits: [stackable, holder] }
  plywoodcrate: { category: plywood_crate, ko: 합판 상자, heavy: true, traits: [stackable] }
  woodencrate: { category: wooden_crate, ko: 나무 상자, heavy: true, traits: [stackable] }
  largecardboardboxe: { category: large_box, ko: 대형 상자, heavy: true, traits: [stackable] }

# 좌표로 받침을 정하는 값 (m)
geometry:
  support_gap_m: 0.03 # 위 물체의 바닥과 아래 것의 윗면 사이가 이 안이면 그 위에 놓인 것
  floor_height_m: 0.05 # 바닥이 이 높이 아래에 있으면 바닥에 놓인 것
  level_step_m: 0.1 # 설비 안에서 높이를 이 단위로 묶어 칸(선반)을 가른다
  min_size_m: 0.001 # 크기가 이보다 작게 읽힌 에셋은 버린다 (상자 정보가 없는 에셋)
  rim_share: 0.5 # 용기 안이라고 하려면 물체 높이의 이만큼 이상이 용기 윗면 아래에 있어야 한다 (아니면 얹힌 것)
  tangle_share: 0.3 # 두 물체 상자가 작은 쪽 부피의 이만큼 넘게 겹치는데 담김이 아니면 서로 파고든 것으로 보고 뺀다

# 사람 손으로 옮길 만한 무게 상한 (kg). 팩의 목록에 적힌 질량을 쓰며, 모델에게는 보여 주지 않고 작업 합성에서만 본다.
graspable_max_kg: 15.0

# 칸의 이름. 선반은 위에서부터 번호를 붙인다. 상판은 맨 위 면이 따로 있는 설비(작업대)의 그 면이다
shelf: { key: shelf, ko: 선반 }
top: { key: top, ko: 상판 }
