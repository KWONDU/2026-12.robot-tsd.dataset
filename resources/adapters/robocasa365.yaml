# RoboCasa365 전용 어휘. 이 데이터셋의 원본 표기를 우리 규격으로 옮기는 표이며,
# 다른 원천에는 해당하지 않는다. 공용 사전(ko_lexicon.yaml)에는 출력 언어에 관한 것만 둔다.
#
# fixture_classes: RoboCasa fixture 클래스명 -> 우리 분류
#   category(영어 식별자) / ko(표시명) / containment(물체 배치 술어) /
#   interactive(false면 배경 요소라 씬에서 제외) / default_states(assume_defaults일 때만)
#   state_key_aliases(이 종류에서 달리 부르는 상태 키. 읽기·정답 대조 뒤에 이름만 바꾼다)
# location_hint_tokens: fixture 명칭에 방향 힌트가 있을 때만 쓰는 위치 서술
# location_hint_prefixes: 클래스별로 원본 명칭의 앞부분이 뜻을 정하는 경우의 서술 (location_hint_tokens보다 먼저).
#   Counter: RoboCasa fixture_utils.fixture_is_type(DINING_COUNTER)가 이름이 island나 dining으로 시작하는 조리대를
#   식사용 조리대(dining counter)로 본다. 지시문의 'dining counter'가 가리키는 조리대다.
# success_state_keys: 태스크 성공 판정이 읽는 가구 상태 키 -> 우리 상태 키 (공용 사전 state_phrases의 키)
# sim_states: Tier B(sim_state: true)에서 시연 첫 프레임 관절 값으로 읽는 가구 상태. 상태 키 -> 기본 판정.
#   joint(가구 이름을 뗀 관절 이름에 대한 정규식) / rule(robocasa_sim.SIM_STATE_RULES 등록 이름) / params.
#   클래스마다 관절 이름이 다르면 fixture_classes의 sim_states가 같은 키를 덮어쓴다(없는 칸은 기본값).
#   기준값은 RoboCasa fixture 코드 그대로다: fixture.py is_open th=0.90, is_closed th=0.005,
#   stove.py 손잡이 0.35 <= 각도 <= 2π-0.35, sink.py 수전 0.40 < 각도 < π.
# sim_object_body_suffix: 물체 cfg 이름 뒤에 붙는 MuJoCo body 이름 꼬리 (예: obj -> obj_main)
fixture_classes:
  Wall:
    category: wall
    ko: 벽
    containment: 'on'
    interactive: false
  Floor:
    category: floor
    ko: 바닥
    containment: 'on'
    interactive: false
  WallAccessory:
    category: wall_accessory
    ko: 벽 장식
    containment: 'on'
    interactive: false
  Accessory:
    category: accessory
    ko: 장식품
    containment: 'on'
    interactive: false
  Box:
    category: box
    ko: 상자
    containment: 'on'
    interactive: false
  Window:
    category: window
    ko: 창문
    containment: 'on'
    interactive: false
  Hood:
    category: hood
    ko: 레인지 후드
    containment: 'on'
    interactive: false
  Stool:
    category: stool
    ko: 스툴
    containment: 'on'
    interactive: true
  Counter:
    category: counter
    ko: 조리대
    containment: 'on'
    interactive: true
  Stovetop:
    category: stovetop
    ko: 스토브 상판
    containment: 'on'
    interactive: true
    default_states:
      turned_on: false
    sim_states:
      turned_on:
        joint: ^knob_((front|rear)_(left|center|right)|center)_joint$
        rule: angle_band
        params: { low: 0.35, high: 5.933185307179586 } # 2π-0.35
  Stove:
    category: stove
    ko: 스토브
    containment: 'on'
    interactive: true
    default_states:
      turned_on: false
    sim_states:
      turned_on:
        joint: ^knob_((front|rear)_(left|center|right)|center)_joint$
        rule: angle_band
        params: { low: 0.35, high: 5.933185307179586 } # 2π-0.35
  Oven:
    category: oven
    ko: 오븐
    containment: in
    interactive: true
    default_states:
      door_open: false
      turned_on: false
  Microwave:
    category: microwave
    ko: 전자레인지
    containment: in
    interactive: true
    default_states:
      door_open: false
      turned_on: false
    sim_states:
      door_open: { joint: "^microjoint$" } # microwave.py door_joint_names
      door_partly_open: { joint: "^microjoint$" }
  ToasterOven:
    category: toaster_oven
    ko: 토스터 오븐
    containment: in
    interactive: true
    default_states:
      door_open: false
      turned_on: false
  Toaster:
    category: toaster
    ko: 토스터
    containment: in
    interactive: true
    default_states:
      turned_on: false
  Sink:
    category: sink
    ko: 싱크대
    containment: in
    interactive: true
    sim_states:
      turned_on:
        joint: ^handle_joint$
        rule: angle_band
        params: { low: 0.40, high: 3.141592653589793 } # π
  Dishwasher:
    category: dishwasher
    ko: 식기세척기
    containment: in
    interactive: true
    default_states:
      door_open: false
      turned_on: false
  CoffeeMachine:
    category: coffee_machine
    ko: 커피머신
    containment: 'on'
    interactive: true
    default_states:
      turned_on: false
  Blender:
    category: blender
    ko: 블렌더
    containment: in
    interactive: true
    default_states:
      door_open: false
      turned_on: false
  BlenderLid: # 블렌더에 딸린 별도 fixture (fixture id가 blender_..._auxiliary_...)
    category: blender_lid
    ko: 블렌더 뚜껑
    containment: 'on'
    interactive: true
  StandMixer:
    category: stand_mixer
    ko: 스탠드 믹서
    containment: in
    interactive: true
    default_states:
      turned_on: false
    sim_states:
      head_raised: { joint: "^head_joint$", rule: door_fraction, params: { open_min: 0.90, closed_max: 0.005 } }
  ElectricKettle:
    category: electric_kettle
    ko: 전기 주전자
    containment: in
    interactive: true
    default_states:
      door_open: false
      turned_on: false
    sim_states:
      lid_open: { joint: "^lid_joint$", rule: door_fraction, params: { open_min: 0.90, closed_max: 0.01 } } # electric_kettle.py
  HingeCabinet:
    category: cabinet
    ko: 캐비닛
    containment: in
    interactive: true
    default_states:
      door_open: false
  SingleCabinet:
    category: cabinet
    ko: 캐비닛
    containment: in
    interactive: true
    default_states:
      door_open: false
  PanelCabinet:
    category: cabinet
    ko: 캐비닛
    containment: in
    interactive: true
    default_states:
      door_open: false
  HousingCabinet:
    category: cabinet
    ko: 수납장
    containment: in
    interactive: true
    default_states:
      door_open: false
  OpenCabinet: # 문 없는 캐비닛. RoboCasa는 이것도 캐비닛으로 치고(fixture_utils CABINET) 지시문도 cabinet이라고 부른다
    category: cabinet
    ko: 캐비닛
    containment: in
    interactive: true
  Drawer:
    category: drawer
    ko: 서랍
    containment: in
    interactive: true
    default_states:
      door_open: false
    sim_states:
      door_open: { joint: slidejoint } # cabinets.py Drawer.door_joint_names
      door_partly_open: { joint: slidejoint }
    # 원천은 서랍도 문(door)으로 다루지만 씬과 정답에서는 서랍 열림으로 부른다 (상태 키 -> 이 종류에서의 키)
    state_key_aliases: { door_open: drawer_open, door_partly_open: drawer_partly_open }
  Fridge:
    category: fridge
    ko: 냉장고
    containment: in
    interactive: true
    default_states:
      door_open: false
    sim_states:
      door_open: { joint: "^(?=.*fridge)(?=.*door)" } # fridge.py 기본 compartment=fridge (냉동실 문 제외)
      door_partly_open: { joint: "^(?=.*fridge)(?=.*door)" }
      freezer_door_open: { joint: "^(?=.*freezer)(?=.*door)", rule: door_fraction, params: { open_min: 0.90, closed_max: 0.005 } }
  FridgeFrenchDoor:
    category: fridge
    ko: 냉장고
    containment: in
    interactive: true
    default_states:
      door_open: false
    sim_states:
      door_open: { joint: "^(?=.*fridge)(?=.*door)" } # fridge.py 기본 compartment=fridge (냉동실 문 제외)
      door_partly_open: { joint: "^(?=.*fridge)(?=.*door)" }
      freezer_door_open: { joint: "^(?=.*freezer)(?=.*door)", rule: door_fraction, params: { open_min: 0.90, closed_max: 0.005 } }
  FridgeSideBySide:
    category: fridge
    ko: 냉장고
    containment: in
    interactive: true
    default_states:
      door_open: false
    sim_states:
      door_open: { joint: "^(?=.*fridge)(?=.*door)" } # fridge.py 기본 compartment=fridge (냉동실 문 제외)
      door_partly_open: { joint: "^(?=.*fridge)(?=.*door)" }
      freezer_door_open: { joint: "^(?=.*freezer)(?=.*door)", rule: door_fraction, params: { open_min: 0.90, closed_max: 0.005 } }
  FridgeBottomFreezer:
    category: fridge
    ko: 냉장고
    containment: in
    interactive: true
    default_states:
      door_open: false
    sim_states:
      door_open: { joint: "^(?=.*fridge)(?=.*door)" } # fridge.py 기본 compartment=fridge (냉동실 문 제외)
      door_partly_open: { joint: "^(?=.*fridge)(?=.*door)" }
      freezer_door_open: { joint: "^(?=.*freezer)(?=.*door)", rule: door_fraction, params: { open_min: 0.90, closed_max: 0.005 } }
sim_states:
  door_open:
    joint: door # fixture.py door_joint_names: 이름에 door가 든 관절
    rule: door_fraction
    params: { open_min: 0.90, closed_max: 0.005 }
  # 원본 기준으로 열림(0.90 이상)도 닫힘(0.005 이하)도 아닌 문: 일부만 열려 있다. 태스크가 문·서랍을 반쯤 열어 두는
  # 장면이 있어(열린 문 닫기, 열린 서랍에서 꺼내기) 이 사실이 빠지면 지시가 가리키는 대상을 알 수 없다.
  # partly_min은 눈에 띄는 벌어짐의 하한이다 (그보다 덜 벌어진 문은 상태를 적지 않는다).
  door_partly_open:
    joint: door
    rule: door_between
    params: { open_min: 0.90, closed_max: 0.005, partly_min: 0.05 }
sim_object_body_suffix: _main
# 가구의 칸을 모델에서 찾는 표식 (가구 이름을 뗀 나머지에 대한 정규식, region 그룹이 칸 이름).
# geom은 '<가구>_reg_<칸>' (전체·내부·물체 상자인 main, int, bbox는 칸이 아니다), site는 화구 자리.
sim_regions:
  geom: "reg_(?P<region>(?!main$|int$|bbox$).+)"
  site: "burner_(?P<region>.+)_place_site"
# 칸마다 따로 있는 관절에서 읽는 칸별 상태 (화구 손잡이). 기준값은 가구 상태의 turned_on과 같다
sim_region_states:
  drawer_open: # 냉장고의 서랍 칸이 열려 있는지 (서랍마다 미는 관절, fridge.py is_open/is_closed reg_type=drawer)
    joint: "^(?P<region>(fridge|freezer)_drawer\\d+)_joint$"
    rule: door_fraction
    params: { open_min: 0.90, closed_max: 0.005 }
  pulled_out: # 식기세척기·오븐의 랙이 밖으로 당겨져 있는지 (랙마다 미는 관절)
    joint: "^(?P<region>rack\\d+)_joint$"
    rule: door_fraction
    params: { open_min: 0.90, closed_max: 0.005 }
  turned_on:
    joint: "^knob_(?P<region>(front|rear)_(left|center|right)|center)_joint$"
    rule: angle_band
    params: { low: 0.35, high: 5.933185307179586 }
# 가구 옆의 조리대를 '조리대 near 가구' 관계로 남긴다 (robocasa_adjacency.py, RoboCasa kitchen.py get_fixture의 ref 규칙).
# references: 옆 조리대를 적을 기준 가구 분류. tie_m: 가장 가까운 거리에서 이 안쪽이면 함께 옆으로 친다 (원본 0.10).
# box_geom_suffixes: 가구 겉 상자 geom의 꼬리 (원본 get_ext_sites: main, 없으면 bbox)
sim_adjacency:
  references: [sink, stove, stovetop, fridge, microwave, dishwasher, oven, toaster, toaster_oven, coffee_machine, blender, stand_mixer, electric_kettle]
  counter: counter
  tie_m: 0.10
  box_geom_suffixes: [_reg_main, _reg_bbox]
sim_object_size_geom_suffix: _reg_bbox # 물체 크기를 읽는 상자 geom: '<물체 이름>_reg_bbox'
location_hint_tokens:
  dining: 식탁 구역
  island: 아일랜드
location_hint_prefixes:
  Counter:
    island: 아일랜드 식탁
    dining: 식탁용 조리대

success_state_keys:
  turned_on: turned_on
  water_on: turned_on # 수전: 물이 나오는 상태를 가동으로 본다
  lid: lid_open # 전기 주전자 뚜껑이 열린 정도 (0 닫힘, 1 열림). 문턱값과 견주는 판정에서 읽는다
# 원천이 배치 가구를 이름 대신 종류 번호(RoboCasa FixtureType)로 적은 경우의 번호 -> 우리 분류.
# 그 종류의 가구가 씬에 하나일 때만 쓴다. 한 분류로 정해지는 번호만 싣는다.
fixture_type_ids:
  1: microwave
  3: oven
  4: sink
  5: coffee_machine
  6: toaster
  7: toaster_oven
  8: fridge
  9: dishwasher
  10: blender
  11: stand_mixer
  12: electric_kettle
