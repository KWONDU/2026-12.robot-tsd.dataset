# 자연어 세계 상태(world_state text 보기)에서 상태 이름표가 없는 상태 키의 한국어 표기 (도메인 이름은 resources/domains)
state_key_ko:
  contents: 내용물

# 접지 검사에서 상태 모순 판단에 쓰는 상충 표현 사전.
# TSD 텍스트에 아래 표현이 있는데 씬 상태가 반대이면 state_conflict로 잡는다.
state_conflict_phrases:
  door_open:
    true: [문 열림, 열려 있]
    false: [문 닫힘, 닫혀 있]
  turned_on:
    true: [가동 중, 켜져 있, 작동 중]
    false: [미가동, 꺼져 있]
  freezer_door_open:
    true: [냉동실 문 열림, 냉동실 문이 열려, 냉동실이 열려]
    false: [냉동실 문 닫힘, 냉동실 문이 닫혀, 냉동실이 닫혀]

# 상태 서술에 이 말이 있으면 해당 상태 키의 상충 검사를 건너뛴다. 더 좁은 부위를 말하는 서술이라서다
# (냉장고 본문은 닫혀 있어도 "냉동실 문이 열려 있음"은 모순이 아니고, freezer_door_open이 따로 검사한다).
state_conflict_qualifiers:
  door_open: [냉동실]

# 관계 술어 한국어 (검토용 Markdown 표시)
# 도메인 표시명 (대시보드의 최종 데이터셋)
domain_ko: { household: 가사, logistics: 물류, manufacturing: 제조 }
# 검수 항목 situation이 설명문에서 상황 사실을 찾을 때 쓰는 말 (verify/situation.py)
situation_words:
  aisle: 통로 # 통로 이름의 앞말 (통로 18). '통로 40, 9, 11'처럼 이어 쓴 번호도 통로로 본다
  aisle_joins: [",", "·", "/", 와, 과, 및, 또는, 혹은, 그리고]
  wait: [기다, 다시 가동, 재가동]
  minute: 분
relation_ko: { "on": 위, "in": 안, near: 근처, held_by: 파지, robot_at: 로봇 위치 }

# 제약 유형 한국어 라벨 (렌더러)
constraint_type_ko:
  precedence: 선후
  resource: 자원
  physical: 물리
  safety: 안전
  spatial: 공간
  other: 기타

# 체크리스트 루브릭 항목 키 -> 한국어 표시명 (스펙 3절 7번, 순서 고정).
# 키 순서가 채점·표시 순서이고, 대시보드·분석 프롬프트의 항목 이름도 여기서 온다.
checklist_items:
  goal_reflected: 작업 목표 반영
  spatiotemporal_reflected: 시간·공간 조건 반영
  objects_and_locations_sufficient: 물체·위치 충분성
  role_assignment_valid: 역할 구분 타당성
  executable_from_description: 설명문만으로 계획 가능

# 샘플 판정 상태 한국어 표시명 (대시보드)
status_ko:
