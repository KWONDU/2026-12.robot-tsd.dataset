  drawer_partly_open:
    true: 서랍 일부 열림
  drawer_open:
    true: 서랍 열림
    false: 서랍 닫힘
  turned_on:
    true: 가동 중
    false: 미가동
  filled:
    true: 내용물 있음
    false: 비어 있음
  lid_open:
    true: 뚜껑 열림
    false: 뚜껑 닫힘
  pulled_out:
    true: 당겨 빼 놓음
    false: 밀어 넣어 둠
  head_raised:
    true: 헤드 올라감
    false: 헤드 내려감

