# fixture/물체 상태 키 → 한국어 표현 (렌더링·접지 검사 공용)
state_phrases:
  door_open:
    true: 문 열림
    false: 문 닫힘
  freezer_door_open:
    true: 냉동실 문 열림
    false: 냉동실 문 닫힘
  door_partly_open: # 완전히 열리지도 닫히지도 않은 문·서랍 (세계 상태에만 나오고 목표 상태 키는 아니다)
