# 데이터 구조 화면의 값 종류 표시명 (JSON Schema type)
schema_type_ko:
  string: 글
  integer: 정수
  number: 숫자
  boolean: 참/거짓
  array: 목록
  object: 묶음
  enum: 정해진 값

# 검수 항목이 하는 일과 통과 기준 (대시보드 데이터 구조 화면). rule의 {이름}은 verify.thresholds 값으로 채우고, 그 값이 비어 있으면 off를 쓴다.
verify_check_info_ko:
  schema:
    desc: 설명문이 정해진 JSON 구조를 지켰는지 봐요
    rule: 구조가 어긋나면 미달
  grounding:
    desc: 설명문에 나온 id·물체·상태가 환경 컨텍스트에 실제로 있는지 봐요
    rule: 없는 것을 하나라도 지어내면 미달
  structure:
    desc: 실행 단계 목록이 없는지, 필드 순서와 물체 위치 병기를 지켰는지 봐요
    rule: 하나라도 어기면 미달
  goal:
    desc: 목표 상태가 정해진 어휘 안에 있고 대상 물체와 맞는지, 처음 씬에서 이미 이뤄진 목표는 아닌지 봐요
    rule: 문제가 있으면 미달
  goal_oracle:
    desc: 목표 상태가 RoboCasa 성공 판정 코드(정답)의 조건을 얼마나 담았는지 재요
    rule: 맞힌 비율 {goal_oracle_min_recall} 이상
    off: 기록만 하고 떨어뜨리지 않음
  situation:
    desc: 작업을 만들 때 코드가 정한 상황 사실(돌아가게 만드는 통로, 기다려야 하는 설비, 시간 창, 가공 시간)이 설명문에 있는지 봐요
    rule: 하나라도 없으면 미달 (상황 사실이 없는 작업은 통과)
  checklist:
    desc: 체크리스트 항목마다 다른 LLM이 점수를 매겨요
    rule: 모든 항목 {checklist_min_item_score}점 이상
  probe:
    desc: 설명문만 보고 작업을 계획할 때 빠진 정보가 있는지 LLM이 판정해요
    rule: "{probe_min_score}점 이상"
  resolvability:
    desc: 다시 쓴 지시가 환경 정보만으로 원래 작업을 가리키는지 재작성 단계에서 LLM이 판정해요
    rule: 해소 안 되면 미달

# 프롬프트 화면(대시보드): LLM 역할이 하는 일. 키는 roles.py의 등록 이름이고 순서는 파이프라인 순서다.
role_purpose_ko:
  rewrite: RoboCasa의 영어 원문 지시를 한국어 발화로 다시 써요
  resolvability: 다시 쓴 지시가 환경 정보만으로 원래 작업을 가리키는지 판정해요
  generate: 지시와 환경 컨텍스트를 받아 추론과 작업상황설명문을 만들어요
  checklist: 만든 설명문을 체크리스트 항목마다 채점해요 (생성한 모델과 다른 모델)
  probe: 설명문만 보고 작업을 계획할 때 빠진 정보가 있는지 판정해요

# 프롬프트 화면: 프롬프트 파일의 <<자리>>에 무엇이 들어가는지. 키는 자리 이름이다.
# 목표 상태에 쓸 상태 키가 없는 도메인에서 프롬프트의 상태 키 자리(<<DOMAIN_STATE_KEYS>>)에 넣는 말
no_state_keys_ko: "(없음: 이 도메인에서는 state 단언을 쓰지 않는다)"

prompt_slot_ko:
  USER_INSTRUCTION: 사용자 지시 (한국어로 다시 쓴 것)
  ENVIRONMENT_CONTEXT: 환경 컨텍스트 JSON (모델이 받는 씬 상태)
  ORIGINAL_INSTRUCTION: 원천 데이터셋의 원문 지시 (영어)
  REWRITTEN_INSTRUCTION: 다시 쓴 한국어 지시
  GOLDEN_INSTRUCTION: 골든 예시의 지시
  GOLDEN_CONTEXT: 골든 예시의 환경 컨텍스트
  GOLDEN_OUTPUT: 골든 예시의 출력 (추론과 설명문)
  TSD_JSON: 채점할 설명문 JSON
  TSD_TEXT: 채점할 설명문을 글로 옮긴 것
  DOMAIN_ROBOT: 도메인의 로봇 종류 (resources/domains, 가정은 가정용 로봇)
  DOMAIN_PLACE: 도메인의 장소 (가정은 주방)
  DOMAIN_FIXTURE: 옮기지 않는 설비를 부르는 낱말 (가정은 가구)
  DOMAIN_STATE_KEYS: 목표 상태에 쓸 수 있는 상태 키와 풀이 (도메인 프로필의 goal_state_keys)
  DOMAIN_RELATIONS: 목표 상태에 쓸 수 있는 관계 술어와 풀이 (도메인 프로필의 goal_relations)
  DOMAIN_KNOWLEDGE: 이 도메인에서만 필요한 지식 (도메인 프로필의 knowledge, 없으면 빈칸)
  EX_ACCESS: 도메인 예시 - 닿으려면 먼저 상태를 바꿔야 하는 것
  EX_PRECONDITION: 도메인 예시 - 환경 설명에서 따라 나오는 선행 조건
  EX_STATE_COMMANDS: 도메인 예시 - 상태를 바꾸라는 지시
  EX_REMOVE: 도메인 예시 - 도착지 없이 없애라는 지시
  EX_UNSPECIFIED: 도메인 예시 - 원 지시가 어느 것인지 정하지 않은 표현
  EX_ORIGIN: 도메인 예시 - 옮길 물체가 처음 놓여 있는 곳 (보조의 초기 위치 기준)
  EX_SPACE: 도메인 예시 - 작업이 시작되는 곳과 끝나는 곳
  EX_RECEPTACLES: 도메인 예시 - 최종 수용 대상
  EX_LOCATIONS: 도메인 예시 - 놓인 곳
  EX_STATES: 도메인 예시 - 상태
  EX_NUMBERED: 도메인 예시 - 번호 붙은 이름
  EX_GOAL_ACTION: 도메인 예시 - 목표 상태가 아닌 행동
