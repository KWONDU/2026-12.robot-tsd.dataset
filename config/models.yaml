# 모델에 대해 참인 것. 실행 설정이 아니라 모델의 속성이라 실행마다 바뀌지 않는다.
# 여기 정의된 키만 config.yaml의 llm.roles에 바인딩할 수 있다.
#
# api_key_env에는 키가 아니라 "키가 담긴 환경변수의 이름"을 적는다. 키 자체는 .env나
# 셸 환경변수로만 주며 어떤 설정 파일에도 넣지 않는다.
# price_per_1m_tokens 단위는 100만 토큰당 USD다. null이면 비용 미상으로 표시되고,
# config.yaml의 estimate.budget_usd가 설정되어 있으면 실행이 차단된다.
# 아래 값은 2026-08-20에 제공사 공식 가격 페이지에서 확인한 정가다. 가격은 바뀌므로 대량
# 생성 전에 다시 확인할 것. OpenAI Batch API는 정가의 50%이며, 전량 생성(5만~10만 건)처럼
# 실시간성이 필요 없는 실행에서는 그쪽이 유리하다.

models:
  gpt-6-sol: # 2026-09 출시 GPT-6 상위. 가격은 2026-09-23 인하가 기준 (캐시 입력은 90% 할인이지만 추정에는 정가를 쓴다)
    backend: openai_compat
    model: gpt-6-sol
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    supports_json_schema: true
    json_schema_strict: true # 스키마 강제 (키가 열린 사전을 쓰는 채점 출력만 안내로 보낸다)
    token_param: max_completion_tokens
    params: { temperature: null }
    concurrency: 32 # 대량 실행용 (반복 점검 때는 4, 첫 1,000개는 16)
    enabled: true
    price_per_1m_tokens: { input: 2.00, output: 10.00, cached_input: 0.20, cache_write: 2.21, expected_cached_share: 0.90 }
  gpt-6-luna: # GPT-6 저가형. 같은 날 인하가 기준
    backend: openai_compat
    model: gpt-6-luna
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    supports_json_schema: true
    json_schema_strict: true # 스키마 강제 (키가 열린 사전을 쓰는 채점 출력만 안내로 보낸다)
    token_param: max_completion_tokens
    params: { temperature: null }
    concurrency: 32 # 대량 실행용 (반복 점검 때는 4, 첫 1,000개는 16)
    enabled: true
    price_per_1m_tokens: { input: 0.10, output: 0.50, cached_input: 0.01, cache_write: 0.125, expected_cached_share: 0.31 }
  gpt-5.4-mini:
    backend: openai_compat
    model: gpt-5.4-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    supports_json_schema: true
    token_param: max_completion_tokens
    # GPT-5 계열은 temperature를 지원하지 않는다. 샘플링 조절은 reasoning_effort로 한다.
    params: { temperature: null }
    concurrency: 4
    enabled: true
    price_per_1m_tokens: { input: 0.75, output: 4.50 }

  gpt-5.4: # 상위 모델. 생성 다양성 확보용 후보
    backend: openai_compat
    model: gpt-5.4
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    supports_json_schema: true
    token_param: max_completion_tokens
    # GPT-5 계열은 temperature를 지원하지 않는다. 샘플링 조절은 reasoning_effort로 한다.
    params: { temperature: null }
    concurrency: 4
    enabled: true
    price_per_1m_tokens: { input: 2.50, output: 15.00 }

  gpt-5-mini: # 이전 세대 mini. temperature 고정 불가 (기본값 1만 허용)
    backend: openai_compat
    model: gpt-5-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    supports_json_schema: true
    token_param: max_completion_tokens
    # GPT-5 계열은 temperature를 지원하지 않는다. 샘플링 조절은 reasoning_effort로 한다.
    params: { temperature: null }
    concurrency: 4
    enabled: true
    price_per_1m_tokens: { input: 0.25, output: 2.00 }

  gpt-5.4-nano: # 채점 전용. 생성에는 쓰지 않는다 (카테고리 식별자를 임의로 바꾸는 경향)
    backend: openai_compat
    model: gpt-5.4-nano
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    supports_json_schema: true
    token_param: max_completion_tokens
    # GPT-5 계열은 temperature를 지원하지 않는다. 샘플링 조절은 reasoning_effort로 한다.
    params: { temperature: null }
    concurrency: 4
    enabled: true
    price_per_1m_tokens: { input: 0.20, output: 1.25 }

  gemini-3-flash:
    backend: gemini
    model: gemini-3-flash
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    supports_json_schema: true
    params: { reasoning_effort: null, verbosity: null } # OpenAI 전용 파라미터는 뺀다
    concurrency: 4
    enabled: false # GEMINI_API_KEY 미설정. 키를 넣으면 true로 바꿔 교차 검수에 다시 투입
    price_per_1m_tokens: { input: 0.25, output: 1.50 } # 키 확보 후 실제 모델 id 기준으로 재확인

  # 생성 에이전트 후보를 OpenRouter로 부른다 (OpenAI 호환 API). 가격은 2026-11-15 OpenRouter 공개 목록 기준이다.
  # OpenAI 전용 파라미터(reasoning_effort, verbosity)는 빼고 보낸다. 세 모델 모두 구조화 출력을 지원한다고 적혀 있다.
  gemini-3.8-flash:
    backend: openai_compat
    model: google/gemini-3.8-flash
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_json_schema: true
    json_schema_strict: true
    token_param: max_tokens
    # seed는 32비트 정수만 받아 뺀다. 출력 한도에 생각 토큰이 포함되므로 한도를 넉넉히 둔다(4096에서 잘렸다)
    # provider.require_parameters: 구조화 출력을 지원하는 제공사로만 보낸다 (OpenRouter가 요청을 여러 제공사로 나눠 보낸다)
    # 출력 한도 32000 (2026-11-16, 사용자 결정): 제조(지도 위 길 따지기)에서 생각이 길어져 16000에 닿는 호출이 16~17%였고
    # 그때마다 빈 답으로 다시 불렀다. 가사·물류 실행은 16000으로 돌았다 (docs/DECISIONS.md)
    params: { reasoning_effort: null, verbosity: null, seed: null, max_tokens: 32000, provider: { require_parameters: true } }
    concurrency: 32
    enabled: true
    price_per_1m_tokens: { input: 0.75, output: 3.75, cached_input: 0.075 }
  qwen3.5-27b:
    backend: openai_compat
    model: qwen/qwen3.5-27b
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_json_schema: true
    json_schema_strict: true
    token_param: max_tokens
    # 모델 카드 권장값(생각 모드, 일반 과제): temperature 1.0, top_p 0.95, top_k 20, presence_penalty 1.5.
    # 출력 한도에 생각 토큰이 포함되므로 넉넉히 둔다(4096에서 잘렸고, 생각까지 약 11,000토큰을 썼다)
    params: { reasoning_effort: null, verbosity: null, max_tokens: 16000, temperature: 1.0, top_p: 0.95, top_k: 20, presence_penalty: 1.5 }
    concurrency: 16
    enabled: true
    price_per_1m_tokens: { input: 0.26, output: 2.6 }
  qwen3.8-27b:
    backend: openai_compat
    model: qwen/qwen3.8-27b
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_json_schema: true
    json_schema_strict: true
    token_param: max_tokens
    # 모델 카드 권장값(생각 모드): temperature 1.0, top_p 0.95, top_k 20, min_p 0, presence_penalty 0 (미러 기준).
    # 출력 한도에는 생각 토큰도 포함되므로 넉넉히 둔다
    params: { reasoning_effort: null, verbosity: null, max_tokens: 16000, temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, provider: { require_parameters: true } }
    concurrency: 16
    enabled: true
    # 제공사마다 가격이 다르다(require_parameters를 만족하는 곳 중에서 OpenRouter가 고른다). 아래는 DeepInfra 값이고, 실행 중에는 usage.cost를 기록한다
    price_per_1m_tokens: { input: 0.15, output: 1.875, cached_input: 0.0375 }
  qwen3.8-27b-high: # qwen3.8-27b와 같은 모델을 생각 정도 high로 (OpenRouter 공통 reasoning 파라미터). 기본값은 끝까지 생각해 호출당 출력이 약 1만 1천 토큰이었다
    backend: openai_compat
    model: qwen/qwen3.8-27b
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_json_schema: true
    json_schema_strict: true
    token_param: max_tokens
    # 출력 한도 32000 (2026-11-16, 사용자 결정): 제조(지도 위 길 따지기)에서 생각이 길어져 16000에 닿는 호출이 16~17%였고
    # 그때마다 빈 답으로 다시 불렀다. 가사·물류 실행은 16000으로 돌았다 (docs/DECISIONS.md)
    params: { reasoning_effort: null, verbosity: null, max_tokens: 32000, temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, reasoning: { effort: high }, provider: { require_parameters: true } }
    concurrency: 96
    enabled: true
    price_per_1m_tokens: { input: 0.15, output: 1.875, cached_input: 0.0375 }
  gemma-4-26b-a4b:
    backend: openai_compat
    model: google/gemma-4-26b-a4b-it
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_json_schema: true
    json_schema_strict: true
    token_param: max_tokens
    params: { reasoning_effort: null, verbosity: null }
    concurrency: 16
    enabled: true
    price_per_1m_tokens: { input: 0.0675, output: 0.225 }
  exaone-4.0-32b:
    backend: openai_compat
    model: exaone-4.0-32b
    params: { reasoning_effort: null, verbosity: null } # vLLM 서버는 이 파라미터를 받지 않는다
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY
    supports_json_schema: true # vLLM OpenAI 호환 서버는 response_format json_schema를 강제 디코딩으로 처리한다
    json_schema_strict: true
    token_param: max_tokens
    concurrency: 8
    enabled: false
    license_note: "EXAONE NC 라이선스 — 데이터셋 공개 전 검토 필요"
    price_per_1m_tokens: { input: 0.0, output: 0.0 } # 자체 서빙. 비용은 토큰이 아니라 GPU 시간

  qwen3.5-35b-a3b:
    backend: openai_compat
    model: qwen3.5-35b-a3b
    params: { reasoning_effort: null, verbosity: null } # vLLM 서버는 이 파라미터를 받지 않는다
    base_url: http://localhost:8001/v1
    api_key_env: VLLM_API_KEY
    supports_json_schema: true # vLLM OpenAI 호환 서버는 response_format json_schema를 강제 디코딩으로 처리한다
    json_schema_strict: true
    token_param: max_tokens
    concurrency: 8
    enabled: false
    price_per_1m_tokens: { input: 0.0, output: 0.0 } # 자체 서빙. 비용은 토큰이 아니라 GPU 시간

  gemma-4-27b:
    backend: openai_compat
    model: gemma-4-27b
    params: { reasoning_effort: null, verbosity: null } # vLLM 서버는 이 파라미터를 받지 않는다
    base_url: http://localhost:8002/v1
    api_key_env: VLLM_API_KEY
    supports_json_schema: true # vLLM OpenAI 호환 서버는 response_format json_schema를 강제 디코딩으로 처리한다
    json_schema_strict: true
    token_param: max_tokens
    concurrency: 8
    enabled: false
    price_per_1m_tokens: { input: 0.0, output: 0.0 } # 자체 서빙. 비용은 토큰이 아니라 GPU 시간

  mock: # 결정론 mock. API 키 없이 파이프라인 전체를 검증할 때 roles를 mock으로 바꿔 쓴다
    backend: mock
    model: mock
    supports_json_schema: true
    concurrency: 8
    enabled: true
    price_per_1m_tokens: { input: 0.0, output: 0.0 } # 호출 비용 없음

  mock-b: # judge ≠ generator 제약을 만족시키기 위한 두 번째 mock
    backend: mock
    model: mock-b
    supports_json_schema: true
    concurrency: 8
    enabled: true
    price_per_1m_tokens: { input: 0.0, output: 0.0 } # 호출 비용 없음
