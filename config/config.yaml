# =============================================================================
# tsdgen 실행 설정. "이번 실행을 어떻게 돌릴 것인가"만 여기 있다.
#
# - 실행 대상 선택은 환경변수 TSDGEN_STAGE 하나로만 한다.
#   (허용값은 stage registry에 등록된 이름이며, 잘못된 값을 주면 목록이 출력됨)
# - 실행마다 바뀌지 않는 것은 registries에 적힌 파일로 나눠 두었다.
#     config/models.yaml   모델의 속성 (백엔드, 엔드포인트, 동시성, 단가, API 키 환경변수명)
#     config/sources.yaml  데이터 원천의 속성 (배포 URL, 타임아웃, 선수신 범위)
#     .env                 비밀값. 키 자체는 어떤 설정 파일에도 넣지 않는다
#   값 하나의 출처는 여전히 한 곳이며, 나뉜 기준은 "실행마다 바뀌는가"다.
# - 코드에는 숫자·경로·이름을 두지 않는다.
# - 20건 검토용 실행: project.n_scenarios 를 20으로 바꾸면 된다.
# =============================================================================

registries: # 실행마다 바뀌지 않는 설정 파일. 경로는 프로젝트 루트 기준
  models: config/models.yaml
  sources: config/sources.yaml

project:
  run_id: example_run
  seed: 20260820
  lang: ko
  n_scenarios: 4960
  # run 스테이지가 실행하는 순서. 각 이름은 stage registry에 등록되어 있어야 한다.
  pipeline_order: [ingest, sample, contextualize, generate, verify, select, export]

paths: # 프로젝트 루트(이 파일이 있는 폴더의 상위) 기준 상대 경로
  raw_cache: data/raw
  scenarios: data/scenarios
  static_map_dir: data/robocasa_static
  llm_cache: data/llm_cache
  runs: runs
  deliverables: deliverables
  schema_dir: schema
  prompts: prompts
  resources: resources
  tmp: tmp
  thumbnails: data/thumbnails # 장면 썸네일 (<어댑터>/<장면 id의 /를 _로>.png). 대시보드의 장면 이미지가 영상 캡처보다 먼저 쓴다

source:
  adapter: robocasa365 # source adapter registry에 등록된 이름 (가정은 robocasa365, 물류는 simready_warehouse. 도메인은 원천이 정한다)
  # prefetch 스테이지가 원천 데이터를 미리 받아 둘 소스 목록 (source adapter registry 이름)
  prefetch_sources: [robocasa365, isaaclab_arena]
  # 어댑터별 설정. 각 어댑터가 자기 스키마를 선언하므로 데이터셋을 추가해도 코드는 안 바뀐다.
  # 원천의 고정 속성(배포 URL 등)은 config/sources.yaml에 있고 여기 값과 합쳐진다.
  options:
    robocasa365:
      splits: [pretrain]
      families: [atomic, composite]
      tasks: null # 명시 목록(예: [CloseDrawer]). null이면 splits/families 전체에서 seed로 선별
      episodes_per_task: 2
      task_oversample_factor: 7.0 # 받을 태스크 수 = 필요 시나리오 × 비중 × 이 값 (7이면 pretrain 300개 전부. 처음 100건 때는 2.0)
      assume_defaults: false # true면 불명 fixture 상태를 기본값으로 채우고 provenance에 기록
      # true면 Tier B: 시연 첫 프레임의 MuJoCo 상태로 물체 pose와 가구 문·손잡이·수전 상태를 채운다.
      # 판정 기준은 resources/adapters/robocasa365.yaml의 sim_states (RoboCasa 원본 기준 그대로).
      # 선택 의존성 numpy·mujoco 필요(pip install -e .[sim]). 끄면 이전과 같은 Tier A
      sim_state: true
      sim_pose_decimals: 3 # pose 좌표 반올림 자릿수 (m, 쿼터니언)
      # 대시보드 샘플 상세의 시연 영상 카메라 (LLM 입력 아님). 수신은 TSDGEN_STAGE=fetch_videos
      video_camera: observation.images.robot0_agentview_left
      family_weights: { atomic: 0.3, composite: 0.7 } # 원본에서 무엇을 얼마나 가져올지
      # 장면 합성(TSDGEN_STAGE=synthesize, LLM 호출 없음): 주방을 고정하고 태스크 템플릿과 seed를 바꿔 reset한다.
      # 장면 수 = kitchens × 템플릿 수 × seeds_per_template. reset 한 건에 약 14초, 장면 하나에 약 50KB.
      synthesis:
        kitchens: 22 # 앵커 주방 수 (배치·스타일 쌍을 project.seed로 고른다)
        templates: null # 태스크 템플릿 이름 목록. null이면 splits/families의 태스크 전부(300개)
        seeds_per_template: 2 # 주방·템플릿마다 reset 횟수
        workers: 32 # 동시에 돌릴 작업자 프로세스 수
        job_timeout_s: 180 # reset 한 건의 제한 시간
    simready_warehouse: # 물류: 창고 팩의 작업 구역(작업대, 랙, 팔레트 묶음, 카트)을 나란히 놓아 장면을 만든다 (ingest, LLM 없음)
      scenes:
        count: 20000 # 만들 장면 수
        cells_per_scene: [1, 2, 2, 3] # 한 장면에 놓을 작업 구역 수의 후보 (seed로 고른다)
        min_objects: 3 # 물체가 이보다 적은 장면은 버린다 (작업을 만들 수 없다)
        max_objects: 40 # 물체가 이보다 많은 장면은 버린다 (세계 상태 글이 너무 길어진다)
        cell_gap_m: 1.0 # 구역을 나란히 놓을 때의 간격
        max_tries: 20 # 조건에 맞는 조합을 찾는 시도 횟수 (장면 수의 배수)
    factory_floor: # 제조: 공장 바닥(작업장 사이 운반)을 규칙집 배치와 시설 배치 벤치마크로 만든다 (ingest, LLM 없음)
      scenes:
        count: 20000 # 만들 장면 수
        workers: 32 # 나눠 만들 프로세스 수 (결과는 같고 시간만 준다. 1이면 한 프로세스)
    simready_workshop: # 제조: 작업대 틀 2~3개(조립 작업대, 공구 보관, 세척기, 압착기, 키팅, 폐기, 부품 랙, 전동 공구)로 작업장 장면을 만든다 (ingest, LLM 없음)
      scenes:
        count: 20000 # 만들 장면 수
        stations_per_scene: [2, 3] # 한 장면에 둘 작업대 틀 수의 후보 (seed로 고른다)
        min_objects: 3
        max_objects: 40

sampling:
  strategy: stratified # sampling strategy registry에 등록된 이름
  # 전략별 설정은 전략 이름을 키로 둔다. 키는 등록된 전략이어야 하고 내용은 그 전략이 검증한다.
  # 선별 전에 적용할 필터 (scenario filter registry 등록 이름). 걸러진 시나리오는
  # 사유와 함께 runs/<run_id>/sample_excluded.jsonl에 남는다.
  # directional_reference: 지시문이 방향·서수("왼쪽 서랍" 등)로 대상을 지목하지만
  # Tier A 씬에는 방향 정보가 없어 태스크가 성립하지 않는 시나리오 제외.
  # 작업을 합성한 시나리오만 돌릴 때는 filters: [composed_only]
  # 합성 장면만 돌릴 때는 filters: [synthesized_only] (받은 시연 600개를 뺀다)
  # 대량 생성은 filters: [], same_scenarios_as_run: null, exclude_tasks_of_runs: [] (칸 이름이 생겨 방향·순서 지시도 쓸 수 있다)
  filters: []
  same_scenarios_as_run: null # 다른 실행이 고른 장면을 그대로 다시 고른다 (null이면 전략이 고른다)
  exclude_tasks_of_runs: [] # 이 실행들이 쓴 태스크의 장면은 고르지 않는다
  stratified:
    # 어느 이름표로 배분할지와 그 비율. 이름표는 시나리오의 strata에 원천이 붙여 준다.
    # 층화 전략은 이름만 보므로 데이터셋 어휘를 알지 못한다.
    quota_key: family
    quotas: { atomic: 0.3, composite: 0.7 } # P0 배분: 100건 = 30 + 70

contextualize:
  # 허용값은 prompts/rewrite/rewrite_<값>.txt 파일 목록에서 유도된다 (예: natural)
  specificity: natural
  # 재작성이 해소 불가 판정을 받으면 이 구체성으로 한 번 다시 쓴다 (허용값은 위와 같음)
  fallback_specificity: explicit
  # LLM에게 세계 상태를 보여 주는 방식 (src/tsdgen/world_state.py 등록 이름). text는 id 없는 한국어 글이고,
  # 실제 로봇이 인식한 세계 상태를 자연어로 넘기는 상황에 맞춘 것이다. json은 이전 방식(환경 컨텍스트 JSON).
  # 프롬프트는 text 보기용이다.
  world_state: text
  # text 보기: 가구 배치가 없는 물체(컵케이크 등)는 좌표로 바로 아래 물체를 찾아 "접시 1 위"로 쓴다.
  # 수평 거리 이하이고 높이 차가 0 이상 이하인 물체 중 가장 가까운 것 (m). p0 장면 실측: 받침과 0에서 13mm
  support_radius_m: 0.06
  support_height_m: 0.08
  # text 보기: 같은 이름의 물체끼리 크기 비교(큰 것부터)를 적는 부피 비 하한. 이보다 비슷하면 적지 않는다
  size_ratio_min: 1.15

# 작업 합성(TSDGEN_STAGE=compose, LLM 호출 없음): 바탕 장면에 있는 물체·가구·칸으로 작업 유형의 빈칸을 채워
# 지시와 목표 상태를 만든다. 같은 상황(유형, 대상 종류, 받는 곳, 출발지와 여닫힘, 조건)은 per_signature개만 고른다.
# 유형은 tasks.base.TASK_TYPES 등록 이름, 낱말과 규칙은 도메인 프로필의 task_synthesis.
# 도메인마다 블록 하나다. 어느 블록을 쓸지는 원천이 정한다(source.adapter의 domain, config/sources.yaml).
compose:
  household:
    types: [relocate, fetch_and_close, store_and_close, load_and_move, heat, cook, wash, relocate_two, next_to, by_size, either, set_state, take_out]
    base_split: synth
    per_signature: 1
    per_type: 1813
  logistics: # 같은 물체가 여럿이고 쌓이거나 담긴 창고 장면. 앞의 6개는 가정과 같은 유형, 뒤는 tasks/types_stock*.py
    types: [relocate, relocate_two, next_to, by_size, load_and_move, move_all, move_one, unstack_top, uncover, stack_on, sort_groups, clear_spot, move_from_place, swap_places, empty_container, pack_items, stack_pair, unstack_all, gather]
    base_split: cells
    per_signature: 1
    per_type: 9800 # 생성 약 23K가 되는 상한 (세 에이전트의 검수 탈락과 겹침을 빼고 20K 언저리가 남게). sort_groups(약 2만 5천)와 gather(6,164) 밖의 22개 유형은 상황을 모두 넣는다
    selection: balanced # 유형 안에서 난이도 단계를 고르게, 덜 나온 물체 종류·장면부터 (tasks/balance.py). 가정은 distinct 그대로
    scene_cap: 50 # 장면은 겹쳐도 되지만 한 장면에 지나치게 몰리지 않게 (넘는 것은 남은 것이 없을 때만)
  manufacturing: # 공장 바닥에서 작업장 사이를 오가는 운반 (지도 기반). 유형은 tasks/types_factory*.py
    types: [deliver, deliver_any_running, chain, ship_window, store, retrieve, tool_fetch, collect_waste, go_to, deliver_two, clear_output]
    base_split: floors
    per_signature: 1
    per_type: 2810 # 24,000을 물 채우기로 맞춘 상한(2,809.7). 상황이 적은 일곱 유형(go_to 111, collect_waste 388, deliver_from_here 843, deliver_any_running 1,234, deliver_to_stopped 1,344, tool_fetch 1,505, clear_output 1,717)은 모두 넣고, 상한 유형 가운데 상황이 적은 둘은 tmp/manufacturing/round_composed.py로 2,809에 맞춘다 (docs/DECISIONS.md)
    selection: balanced
    scene_cap: 50
    workers: 32 # 장면마다 작업 찾기를 나눠 돌린다 (결과는 같다)

llm:
  # 모델 목록은 config/models.yaml에 있다. 여기서는 역할에 어느 모델을 붙일지만 정한다.
  roles: # 역할 바인딩. checklist_judge는 generator별 교차 매핑이며 값 ≠ 키를 로드 시 검증
    rewriter: gpt-6-luna
    # 생성은 두 모델로 나눠 해석·표현 다양성을 확보한다. GEMINI_API_KEY가 들어오면
    # gemini-3-flash를 여기 추가하고 checklist_judge에 짝을 지어 주면 된다 (코드 수정 없음).
    generators: [qwen3.8-27b-high]
    checklist_judge: # 채점은 반드시 생성과 다른 모델이 맡는다 (교차 검수)
      gpt-6-luna: gpt-6-sol
      gpt-6-sol: gpt-6-luna
      gemini-3.8-flash: gpt-6-luna
      qwen3.5-27b: gpt-6-luna
      gemma-4-26b-a4b: gpt-6-luna
      qwen3.8-27b: gpt-6-luna
      qwen3.8-27b-high: gpt-6-luna
    probe_judge: gpt-6-luna
    resolvability_judge: gpt-6-luna
  per_scenario_k: 1 # 시나리오당 생성 수 (generators를 라운드로빈). 반복 점검 때는 2
  selection: best_of_k # selection strategy registry에 등록된 이름
  # extra는 요청에 그대로 실린다. 받지 못하는 모델은 models.yaml의 params에서 null로 뺀다.
  generation:
    temperature: 0.7
    max_output_tokens: 4096
    json_retry: 2
    extra: { reasoning_effort: medium, verbosity: medium }
  judging:
    temperature: 0.0
    max_output_tokens: 4096
    json_retry: 2
    # 채점 모델 비교(tmp/judge_bench.py) 결과 high는 low 대비 총점 +0.2, 통과율 +10%p를 주지만
    # 비용·지연이 3.6배이고 판정 뒤집힘은 똑같이 1/10이라 안정성을 사지 못한다. low를 기본으로 둔다.
    extra: { reasoning_effort: low, verbosity: low }
  retry: { max_attempts: 4, base_delay_s: 2.0, request_timeout_s: 180 }

prompts_versions: # 역할별 프롬프트 파일 이름 (prompts/<역할>/<이름>.txt, 재작성은 <이름>_<구체성>.txt)
  generate: generate
  rewrite: rewrite
  checklist: checklist
  probe: probe
  resolvability: resolvability

verify:
  # 검수 항목과 실행 순서. 앞 항목이 실패하면 뒤는 생략된다. 이름은 verify check registry 등록값.
  # goal: 목표 상태·완료 판정의 형식·접지·일관성과 무의미한 목표(초기 씬에서 이미 성립)를 규칙으로 검사.
  # goal_oracle: 원천의 성공 판정(정답)과 목표 상태를 대조. 기본은 기록만 하고 통과시킨다 (thresholds 참고).
  checks: [schema, grounding, structure, goal, goal_oracle, situation, checklist, probe] # situation은 작업 합성이 상황 사실을 남긴 시나리오(제조)에서만 대조하고 나머지는 그냥 통과한다
  thresholds: # 통과 기준 (스펙 5.5 기본값)
    checklist_min_item_score: 1
    probe_min_score: 1
    # 원천 성공 판정(정답) 대비 목표 상태 재현율 하한. null이면 기록만 한다 (값을 넣으면 미달 샘플을 탈락)
    goal_oracle_min_recall: null
  score_max: 2 # 채점 척도 상한 (checklist 항목·probe 공통, 척도는 채점 프롬프트가 정의)

estimate:
  chars_per_token: 2.4 # 한국어+JSON 혼합 토큰 추정 계수
  assumed_output_tokens: # 역할별 예상 출력 토큰 (비용 추정용)
    rewrite: 200
    resolvability: 200
    generate: 1500
    checklist: 700
    probe: 500
  budget_usd: null
  confirm_over_budget: false # true여야 예산 초과 실행 허용 (스펙의 --yes 대응)
  # 모델별 단가는 config/models.yaml의 price_per_1m_tokens에 있다

dashboard: # TSDGEN_STAGE=dashboard 로 띄우는 로컬 대시보드 (조회 전용)
  host: 127.0.0.1
  port: 8765
  run_id: null # 열람할 실행. null이면 project.run_id, 없으면 가장 최근 실행
  poll_seconds: 15 # 화면이 실행 목록·진행 상태를 다시 읽는 간격 (초)
  # 최종 데이터셋 (대시보드 실행 목록 맨 위 '최종 데이터셋'): 도메인마다 묶을 실행. 실행마다 검수를 통과한(accepted) 샘플만 쓰고,
  dataset: {} # 도메인 -> 묶을 실행 이름 목록 (예: household: [run_a, run_b])
  stale_after_min: 15 # 산출물이 이 시간 넘게 안 바뀌었는데 끝나지 않은 실행은 "멈춤 또는 미완료"로 표시
  # LLM 분석(채팅으로 요청 시 에이전트가 실행)의 모델·파라미터.
  # 파이프라인 역할과 분리되어 비용 추정에 안 섞인다.
  model: gpt-5.4-mini
  prompt_version: v1 # prompts/analysis/<액션>_<버전>.txt
  temperature: 0.2
  max_output_tokens: 4096
  json_retry: 2
  extra: { reasoning_effort: medium, verbosity: low }

export:
  # export format registry에 등록된 이름. 문서는 readme 하나로 통합 (md는 그 안에 합쳐짐).
  # arena_yaml(Isaac Lab-Arena env spec, docs/ARENA_INTEROP.md)은 KIST 전달에서 빠져 기본 제외.
  formats: [jsonl, readme, stats, kist_json]
  # 함께 전달하는 분석 리포트(Claude Artifact) URL. 발행 후 채우고 export 재실행하면 README에 실린다.
  report_url: null # Artifact 링크는 KIST 전달물에서 제외하기로 결정 (2026-09-01)
  # kist_json이 내보낼 생성 모델. 단일 모델의 검수 통과분만 전달한다 (null이면 채택본)
  kist_generator: qwen3.8-27b-high # 전달용으로 고를 생성 모델. 이 실행의 생성 모델이어야 한다 (gpt-6-sol 실행에서는 gpt-6-sol)

# 변경 이력은 docs/SCHEMA_CHANGELOG.md. tsd 2.0: task_goal이 요약·목표 상태·완료 판정을 담는 객체가 됨
schema_versions: { scene_state: "0.6", tsd: "3.3", sample: "1.14" }
